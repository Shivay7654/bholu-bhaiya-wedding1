<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ravi Prakash Weds Jyoti Singh | Wedding Invitation</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Encodes the path into the query string and redirects to index.html
      var pathSegmentsToKeep = 1; // Number of path segments in the base URL

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to wedding invitation…
  </body>
</html>
